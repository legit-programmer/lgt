[project]
name = "lgt"
version = "0.1.0"
description = "multi agent workspace"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142.2",
    "openai-codex==0.160.1",
    "uvicorn[standard]>=0.54.0",
    "pillow>=12.0.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
