[package]
name = "lgt-desktop"
version = "0.1.0"
description = "Lgt desktop shell"
authors = ["Lgt"]
license = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "lgt_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json"] }
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
